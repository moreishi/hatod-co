name: CI

on:
  push:
    branches: [develop, "feature/*"]
  pull_request:
    branches: [develop]

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hailing/api exec prisma generate
      - run: pnpm --filter @hailing/worker exec prisma generate --schema ../api/prisma/schema.prisma
      - run: pnpm exec turbo run build test typecheck lint --force --filter='!@hailing/e2e'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hailing/api exec prisma generate
      - run: pnpm exec turbo run build --force
      - run: pnpm --filter @hailing/e2e exec playwright install --with-deps chromium
      - run: pnpm exec turbo run test --filter=@hailing/e2e --force
      - run: |
          cp apps/api/.env.example apps/api/.env
          pnpm --filter @hailing/api exec prisma migrate deploy
          pnpm --filter @hailing/api run prisma:seed
          pnpm --filter @hailing/api run prisma:validate

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hailing
          POSTGRES_PASSWORD: hailing
          POSTGRES_DB: hailing
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/api/scripts/check-schema-drift.mjs
      - run: pnpm --filter @hailing/api exec prisma validate --schema prisma/postgres/schema.prisma
        env:
          DATABASE_URL: postgresql://hailing:hailing@localhost:5432/hailing
      - run: pnpm --filter @hailing/api exec prisma migrate deploy --schema prisma/postgres/schema.prisma
        env:
          DATABASE_URL: postgresql://hailing:hailing@localhost:5432/hailing
      # Migration coverage: replay the committed migrations into a shadow DB
      # and diff against the schema. Non-empty diff = a model/column shipped
      # without a migration (the DeviceToken/FareSchedule/reviewNote class
      # of bug that 006/007 closed). Fails CI with exit code 2.
      - run: psql postgresql://hailing:hailing@localhost:5432/postgres -c "CREATE DATABASE hailing_shadow;"
      - run: >-
          pnpm --filter @hailing/api exec prisma migrate diff
          --from-migrations prisma/postgres/migrations
          --to-schema-datamodel prisma/postgres/schema.prisma
          --shadow-database-url postgresql://hailing:hailing@localhost:5432/hailing_shadow
          --script --exit-code
