# LocalStage — full local stack (spec §54). Dev/test only; production is Coolify.
# Usage: docker compose -f infrastructure/docker-compose.yml up --build
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hailing
      POSTGRES_PASSWORD: hailing
      POSTGRES_DB: hailing
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: hailing
      RABBITMQ_DEFAULT_PASS: hailing

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  adminer:
    image: adminer:4-standalone
    ports: ["8080:8080"]
    depends_on: [postgres]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    ports: ["3001:3001"]
    env_file: [../.env]
    depends_on: [postgres, redis, rabbitmq]

  agency:
    build: { context: .., dockerfile: apps/agency/Dockerfile }
    ports: ["3002:3002"]
    env_file: [../.env]
    depends_on: [api]

  worker:
    build: { context: .., dockerfile: apps/worker/Dockerfile }
    env_file: [../.env]
    depends_on: [rabbitmq, postgres]

volumes:
  pgdata:
